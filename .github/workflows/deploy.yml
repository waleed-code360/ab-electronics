name: Deploy AB Electronics with Live Haier Catalog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install catalog sync dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Sync all current Haier Pakistan products
        run: npm run sync:haier

      - name: Show generated catalog summary
        run: |
          cat haier-sync-summary.json
          echo "Downloaded product images:"
          find assets/products -type f | wc -l

      - name: Cache-bust generated catalog and site JS
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          mv assets/js/data.js "assets/js/data-${SHORT_SHA}.js"
          cp assets/js/site.js "assets/js/site-${SHORT_SHA}.js"
          for file in index.html products.html product.html about.html contact.html; do
            sed -i "s#assets/js/data.js#assets/js/data-${SHORT_SHA}.js#g" "$file"
            sed -i "s#assets/js/site.js#assets/js/site-${SHORT_SHA}.js#g" "$file"
          done
          echo "Catalog asset: assets/js/data-${SHORT_SHA}.js"
          grep -R "assets/js/data-" -n *.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
